<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.52" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0e7ff"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- star field -->
  <circle cx="388" cy="98" r="7" fill="#ffffff" opacity="0.9"/>
  <circle cx="330" cy="62" r="4.5" fill="#ffffff" opacity="0.55"/>
  <circle cx="436" cy="166" r="4.5" fill="#ffffff" opacity="0.45"/>
  <circle cx="98" cy="120" r="5" fill="#ffffff" opacity="0.4"/>
  <circle cx="140" cy="76" r="3.5" fill="#ffffff" opacity="0.5"/>

  <!-- orbit ring: back pass (drawn behind the house) -->
  <g transform="translate(256 272) rotate(-18)">
    <ellipse rx="152" ry="58" fill="none" stroke="url(#ring)" stroke-width="14" opacity="0.55"/>
  </g>

  <!-- house / nest mark -->
  <g transform="translate(256 262)">
    <path d="M -88 8 L 0 -70 L 88 8 V 76 a 20 20 0 0 1 -20 20 H -68 a 20 20 0 0 1 -20 -20 Z" fill="#ffffff"/>
    <path d="M -88 8 L 0 -70 L 88 8" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-17" y="38" width="34" height="58" rx="15" fill="url(#bg)"/>
  </g>

  <!-- orbit ring: front pass (crosses in front of the house) -->
  <g transform="translate(256 272) rotate(-18)">
    <path d="M 152 0 A 152 58 0 0 1 -152 0" fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="106" cy="37.4" r="17" fill="#ffffff"/>
    <ellipse cx="106" cy="37.4" rx="26" ry="8.5" fill="none" stroke="#c7d2fe" stroke-width="5" transform="rotate(-12 106 37.4)"/>
  </g>
</svg>
