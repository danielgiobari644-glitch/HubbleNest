<!DOCTYPE html>
<html lang="en" class="dark-theme">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Public post — HubbleNest</title>
  <meta name="description" content="A public post shared from the HubbleNest community." />
  <link rel="canonical" href="https://danielgiobari644-glitch.github.io/HubbleNest/feed/post/" />
  <meta name="robots" content="index,follow" />
  <meta name="theme-color" content="#070a12" />
  <meta property="og:title" content="Public post — HubbleNest" />
  <meta property="og:description" content="A public post shared from the HubbleNest community." />
  <meta property="og:type" content="article" />
  <meta property="og:image" content="https://danielgiobari644-glitch.github.io/HubbleNest/hero-cosmic.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="./style.css?v=15" />
  <link rel="stylesheet" href="./public.css?v=15" />
</head>
<body class="public-body">
  <header class="pub-header">
    <a class="pub-brand" href="./index.html" aria-label="HubbleNest home"><img src="./icon.svg" alt="" width="30" height="30" /><span>HubbleNest</span></a>
    <nav class="pub-nav" aria-label="Site">
      <a href="./features.html">Features</a><a href="./spaces.html">Spaces</a><a href="./feed.html">Feed</a><a href="./games.html">Games</a><a href="./help.html">Help</a>
    </nav>
    <a class="pub-cta" href="./index.html">Open HubbleNest</a>
  </header>
  <main class="pub-main">
    <div class="pub-doc" id="pub-doc">
      <div class="pub-doc-head">
        <div class="pub-doc-meta" id="post-meta"><span>Loading…</span></div>
        <h1 class="pub-doc-title" id="post-title">Public post</h1>
      </div>
      <div class="pub-doc-body rich-text" id="post-body"></div>
      <div class="pub-att-grid" id="post-atts"></div>
      <p class="pub-p" style="margin-top:26px;"><a class="pub-link" href="./index.html">Join the conversation on HubbleNest →</a></p>
    </div>
  </main>
  <footer class="pub-footer">
    <div class="pub-footer-base">© <span id="pub-year">2026</span> HubbleNest. <a class="pub-link" href="./privacy.html">Privacy</a> · <a class="pub-link" href="./terms.html">Terms</a> · <a class="pub-link" href="./community-guidelines.html">Guidelines</a></div>
  </footer>
  <script>document.getElementById('pub-year').textContent = new Date().getFullYear();</script>
  <script type="module">
    // Public post viewer — ONLY posts explicitly published to the web
    // (publicPosts mirror written by the author) are ever shown here.
    import { db, doc, getDoc } from './firebase.js';
    import { renderRichText } from './format.js';
    import { escapeHtml, formatDateTime, getAvatarUrl } from './utils.js';

    const id = new URLSearchParams(location.search).get('id') || '';
    const meta = document.getElementById('post-meta');
    const title = document.getElementById('post-title');
    const body = document.getElementById('post-body');
    const atts = document.getElementById('post-atts');

    try {
      if (!/^[A-Za-z0-9_-]{1,60}$/.test(id)) throw new Error('bad-id');
      const snap = await getDoc(doc(db, 'publicPosts', id));
      if (!snap.exists()) throw new Error('missing');
      const p = snap.data();
      document.title = `${(p.authorName || 'Member')} on HubbleNest`;
      meta.innerHTML = `
        <img src="${getAvatarUrl(p.authorPhoto, p.authorName)}" alt="" />
        <b>${escapeHtml(p.authorName || 'Member')}</b>
        <span>·</span><span>${formatDateTime(p.createdAt)}</span>
        <span class="pub-chip">Public post</span>`;
      title.textContent = p.title ? p.title : `A post by ${p.authorName || 'a member'}`;
      body.innerHTML = renderRichText(p.text || '');
      const list = Array.isArray(p.attachments) ? p.attachments : [];
      atts.innerHTML = list.filter(a => String(a.resourceType || '').startsWith('image'))
        .map(a => `<a href="${a.url}" target="_blank" rel="noopener noreferrer"><img src="${a.url}" alt="${escapeHtml(a.originalFilename || 'Attachment')}" loading="lazy" /></a>`).join('');
      const files = list.filter(a => !String(a.resourceType || '').startsWith('image'));
      if (files.length) {
        atts.insertAdjacentHTML('beforeend', `<div class="pub-files" style="grid-column:1/-1;">` + files.map(a =>
          `<a class="pub-file-row" style="display:flex;" href="${a.url}" target="_blank" rel="noopener noreferrer"><span>${escapeHtml(a.originalFilename || 'File')}</span><span>${escapeHtml(a.resourceType || 'file')}</span></a>`).join('') + `</div>`);
      }
      const ld = document.createElement('script');
      ld.type = 'application/ld+json';
      ld.textContent = JSON.stringify({
        '@context': 'https://schema.org', '@type': 'SocialMediaPosting',
        headline: title.textContent, datePublished: p.createdAt?.toDate?.()?.toISOString?.() || undefined,
        author: { '@type': 'Person', name: p.authorName || 'Member' }
      });
      document.head.appendChild(ld);
    } catch (err) {
      document.getElementById('pub-doc').innerHTML = `<div class="pub-missing">
        <h1>This post is not public</h1>
        <p class="pub-p">It may not exist, or its author has not published it to the web. Private posts stay private — always.</p>
        <a class="btn btn-primary" href="./index.html">Open HubbleNest</a></div>`;
    }
  </script>
</body>
</html>
