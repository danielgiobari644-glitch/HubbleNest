<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" fill="none">
  <defs>
    <linearGradient id="bh-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f8ff"/>
      <stop offset="55%" stop-color="#c9d8ff"/>
      <stop offset="100%" stop-color="#8fa8f5"/>
    </linearGradient>
    <linearGradient id="bh-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1030"/>
      <stop offset="100%" stop-color="#131a4a"/>
    </linearGradient>
    <linearGradient id="bh-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#087CFF"/>
      <stop offset="100%" stop-color="#A020FF"/>
    </linearGradient>
    <linearGradient id="bh-bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#155EFF"/>
      <stop offset="100%" stop-color="#A020FF"/>
    </linearGradient>
    <radialGradient id="bh-halo" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#2b6bff" stop-opacity=".55"/>
      <stop offset="60%" stop-color="#7b2bff" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#7b2bff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ambient halo -->
  <ellipse cx="200" cy="150" rx="195" ry="140" fill="url(#bh-halo)"/>
  <circle cx="72" cy="60" r="3" fill="#8fd0ff" opacity=".9"/>
  <circle cx="352" cy="46" r="2.4" fill="#c9a6ff" opacity=".85"/>
  <circle cx="382" cy="120" r="2" fill="#8fd0ff" opacity=".7"/>
  <circle cx="40" cy="190" r="2.2" fill="#c9a6ff" opacity=".7"/>
  <circle cx="330" cy="236" r="2.6" fill="#8fd0ff" opacity=".6"/>

  <!-- speech bubble -->
  <g>
    <rect x="238" y="26" width="132" height="86" rx="24" fill="url(#bh-bubble)"/>
    <path d="M268 108 l-6 26 30 -24 Z" fill="#8b3bff"/>
    <circle cx="282" cy="69" r="8" fill="#ffffff" opacity=".95"/>
    <circle cx="308" cy="69" r="8" fill="#ffffff" opacity=".78"/>
    <circle cx="334" cy="69" r="8" fill="#ffffff" opacity=".55"/>
  </g>

  <!-- robot -->
  <g>
    <!-- antenna -->
    <line x1="196" y1="58" x2="196" y2="86" stroke="url(#bh-glow)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="196" cy="50" r="11" fill="#0b1030" stroke="url(#bh-glow)" stroke-width="5"/>

    <!-- head -->
    <rect x="112" y="82" width="168" height="128" rx="46" fill="url(#bh-body)"/>
    <!-- headset band -->
    <path d="M104 138 a92 92 0 0 1 184 0" stroke="#5f7bff" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- ear cups -->
    <rect x="92" y="128" width="30" height="58" rx="14" fill="#4f6bff"/>
    <rect x="278" y="128" width="30" height="58" rx="14" fill="#4f6bff"/>
    <rect x="99" y="140" width="16" height="34" rx="8" fill="#08D9FF" opacity=".85"/>
    <rect x="285" y="140" width="16" height="34" rx="8" fill="#08D9FF" opacity=".85"/>

    <!-- face screen -->
    <rect x="132" y="106" width="128" height="82" rx="30" fill="url(#bh-face)"/>
    <!-- happy eyes -->
    <path d="M156 140 q10 -16 20 0" stroke="#4adeff" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M212 140 q10 -16 20 0" stroke="#4adeff" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- smile -->
    <path d="M172 158 q14 12 28 0" stroke="#4adeff" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- cheek dots -->
    <circle cx="152" cy="160" r="4.5" fill="#7c5cff" opacity=".8"/>
    <circle cx="240" cy="160" r="4.5" fill="#7c5cff" opacity=".8"/>

    <!-- body -->
    <rect x="140" y="214" width="112" height="72" rx="30" fill="url(#bh-body)"/>
    <rect x="168" y="232" width="56" height="36" rx="16" fill="#0e1538"/>
    <circle cx="196" cy="250" r="9" fill="#08D9FF"/>
    <circle cx="196" cy="250" r="4" fill="#e8fbff"/>

    <!-- arms -->
    <path d="M138 236 q-34 6 -44 34" stroke="#93a8f7" stroke-width="16" stroke-linecap="round"/>
    <path d="M254 240 q36 2 52 -18" stroke="#93a8f7" stroke-width="16" stroke-linecap="round"/>
    <circle cx="92" cy="274" r="12" fill="#4f6bff"/>
    <circle cx="310" cy="218" r="12" fill="#4f6bff"/>
  </g>
</svg>
