  <script>
    // GitHub Pages clean-URL bridge: /HubbleNest/features → features.html,
    // /feed/post/ID → post.html?id=ID, /games/ID, /spaces/ID, /help/SLUG,
    // /join/CODE → index.html?join=CODE. Human-friendly URLs keep working
    // after refresh; canonical URLs in the sitemap point at the real files.
    (function () {
      var path = decodeURIComponent(location.pathname).replace(/\/+$/, '');
      var seg = path.split('/').filter(Boolean);
      var file = seg.pop() || '';
      var m;
      if (/^HN-[A-Z0-9]{6}$/i.test(file)) {
        location.replace('./index.html?join=' + encodeURIComponent(file.toUpperCase())); return;
      }
      if ((m = file.match(/^(.*)\.html?$/i))) { location.replace('./' + m[1] + '.html'); return; }
      if (file === 'features' || file === 'spaces' || file === 'feed' || file === 'games' ||
          file === 'use-cases' || file === 'about' || file === 'contact' || file === 'privacy' ||
          file === 'terms' || file === 'community-guidelines' || file === 'for-schools' ||
          file === 'for-churches' || file === 'for-teams' || file === 'for-communities') {
        location.replace('./' + file + '.html'); return;
      }
      if (file === 'help') {
        var slug = seg[seg.length - 1];
        location.replace('./help.html' + (slug ? '#' + slug : '')); return;
      }
      if (file === 'join' && seg.length) {
        location.replace('./index.html?join=' + encodeURIComponent(seg[seg.length - 1].toUpperCase())); return;
      }
      if (file === 'post') { location.replace('./post.html' + (seg.length ? '?id=' + encodeURIComponent(seg[seg.length - 1]) : '')); return; }
      if (file === 'games' || file === 'game') { location.replace('./game.html' + (seg.length ? '?id=' + encodeURIComponent(seg[seg.length - 1]) : '')); return; }
      if (file === 'spaces' || file === 'space') { location.replace('./space.html' + (seg.length ? '?id=' + encodeURIComponent(seg[seg.length - 1]) : '')); return; }
      location.replace('./index.html');
    })();
  </script>
